name: Build NanoPi K1 Plus

on:
  push:
    branches:
      - feat/nanopi-k1-plus
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile (default uses configs/NanoPi_K1_Plus.config)
        required: false
        default: default
        type: string
      source_ref:
        description: ImmortalWrt commit SHA or branch to build
        required: false
        default: 4cafb73e88b6cf61cfeca2ee6cf8ecabb60f7a07
        type: string
      debug:
        description: Enable verbose build output
        required: false
        default: false
        type: boolean
      watchdog_mode:
        description: Wi-Fi diagnostic watchdog mode (recover or observe)
        required: false
        default: recover
        type: choice
        options:
          - recover
          - observe
      keep_build_info:
        description: Keep source and build directory inventory
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_PROFILE: ${{ github.event.inputs.profile || 'default' }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || '4cafb73e88b6cf61cfeca2ee6cf8ecabb60f7a07' }}
      DEBUG_BUILD: ${{ github.event.inputs.debug || 'false' }}
      WATCHDOG_MODE: ${{ github.event.inputs.watchdog_mode || 'recover' }}
      KEEP_BUILD_INFO: ${{ github.event.inputs.keep_build_info || 'false' }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7.0.0

      - name: Check disk space
        run: df -h

      - name: Release runner space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: Check patch formats before source download
        shell: pwsh
        run: ./scripts/check-patch-stack.ps1 -Mode wifi_release_v1 -FormatOnly

      - name: Check Wi-Fi release marker validation
        run: ./scripts/test-wifi-release-marker.sh
      - name: Test Wi-Fi watchdog with BusyBox applets
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static
          busybox 2>&1 | head -n 1
          mkdir -p .work/busybox-bin
          for applet in sh awk grep; do
            ln -sf "$(command -v busybox)" ".work/busybox-bin/$applet"
          done
          PATH="$GITHUB_WORKSPACE/.work/busybox-bin:$PATH" busybox sh \
            scripts/test-wifi-watchdog-sim.sh \
            overlays/wifi_release_v1/files/usr/sbin/k1plus-wifi-watchdog \
            overlays/wifi_release_v1/files/usr/libexec/wifi-diag-collect.sh
          PATH="$GITHUB_WORKSPACE/.work/busybox-bin:$PATH" busybox sh \
            scripts/test-wifi-settle.sh \
            overlays/wifi_release_v1/files/usr/libexec/k1plus-wifi-settle

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget xsltproc device-tree-compiler \
            python3-pyelftools ccache

      - name: Cache downloads and ccache
        uses: actions/cache@v6.1.0
        with:
          path: |
            .work/openwrt/dl
            .cache/ccache
          key: immortalwrt-${{ env.SOURCE_REF }}-${{ runner.os }}-${{ runner.arch }}

      - name: Clone fixed source
        run: |
          set -o pipefail
          mkdir -p .work .cache/ccache
          ./scripts/prepare-source.sh "$GITHUB_WORKSPACE/.work/openwrt" "$SOURCE_REF" 2>&1 | tee .work/source.log

      - name: Update feeds and apply K1 Plus patches
        run: |
          set -o pipefail
          cd .work/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cd "$GITHUB_WORKSPACE"
          case "$BUILD_PROFILE" in
            default)
              config_path="configs/NanoPi_K1_Plus.config"
              patch_mode="recovery"
              ;;
            *)
              config_path="configs/NanoPi_K1_Plus_${BUILD_PROFILE}.config"
              patch_mode="$BUILD_PROFILE"
              ;;
          esac
          [ -f "$config_path" ] || { echo "missing config: $config_path" >&2; exit 1; }
          ./scripts/apply-patches.sh .work/openwrt "$GITHUB_WORKSPACE" "$patch_mode" | tee .work/patch.log
          case "$WATCHDOG_MODE" in
            recover|observe) ;;
            *) echo "invalid WATCHDOG_MODE: $WATCHDOG_MODE" >&2; exit 1 ;;
          esac
          if [ "$BUILD_PROFILE" = wifi_release_v1 ]; then
            install -D -m 0644 /dev/null .work/openwrt/files/etc/wifi-watchdog.mode
            printf '%s\n' "$WATCHDOG_MODE" > .work/openwrt/files/etc/wifi-watchdog.mode
          fi
          cp "$config_path" .work/openwrt/.config
          cd .work/openwrt
          kernel_config_fragment=target/linux/generic/config-6.18
          [ -f "$kernel_config_fragment" ] || { echo "missing kernel config fragment: $kernel_config_fragment" >&2; exit 1; }
          if [ "$BUILD_PROFILE" = wifi_release_v1 ]; then
            for symbol in CONFIG_PROVE_LOCKING CONFIG_LOCKDEP CONFIG_DEBUG_LOCK_ALLOC CONFIG_DEBUG_MUTEXES CONFIG_DEBUG_SPINLOCK; do
              if grep -q "^${symbol}=" "$kernel_config_fragment"; then
                sed -i "s/^${symbol}=.*/# ${symbol} is not set/" "$kernel_config_fragment"
              elif ! grep -q "^# ${symbol} is not set$" "$kernel_config_fragment"; then
                printf '# %s is not set\n' "$symbol" >> "$kernel_config_fragment"
              fi
            done
          else
            for symbol in CONFIG_DEBUG_KERNEL CONFIG_PROVE_LOCKING CONFIG_DEBUG_LOCK_ALLOC CONFIG_DEBUG_MUTEXES CONFIG_LOCKDEP; do
              if grep -q "^${symbol}=" "$kernel_config_fragment"; then
                sed -i "s/^${symbol}=.*/${symbol}=y/" "$kernel_config_fragment"
              elif grep -q "^# ${symbol} is not set$" "$kernel_config_fragment"; then
                sed -i "s/^# ${symbol} is not set$/${symbol}=y/" "$kernel_config_fragment"
              else
                printf '%s=y\n' "$symbol" >> "$kernel_config_fragment"
              fi
            done
          fi
          top_level_config=.config
          [ -f "$top_level_config" ] || {
            echo "missing top-level config: $top_level_config" >&2
            exit 1
          }
          for symbol in CONFIG_KERNEL_PROVE_LOCKING; do
            if [ "$BUILD_PROFILE" = wifi_release_v1 ]; then
              if grep -q "^${symbol}=" "$top_level_config"; then
                sed -i "s/^${symbol}=.*/# ${symbol} is not set/" "$top_level_config"
              elif ! grep -q "^# ${symbol} is not set$" "$top_level_config"; then
                printf '# %s is not set\n' "$symbol" >> "$top_level_config"
              fi
            elif grep -q "^${symbol}=" "$top_level_config"; then
              sed -i "s/^${symbol}=.*/${symbol}=y/" "$top_level_config"
            elif grep -q "^# ${symbol} is not set$" "$top_level_config"; then
              sed -i "s/^# ${symbol} is not set$/${symbol}=y/" "$top_level_config"
            else
              printf '%s=y\n' "$symbol" >> "$top_level_config"
            fi
          done
          make defconfig
          if [ "$BUILD_PROFILE" = wifi_release_v1 ]; then
            grep -qx 'CONFIG_BUSYBOX_CONFIG_CKSUM=y' .config || {
              echo 'BusyBox cksum applet was not retained by make defconfig' >&2
              exit 1
            }
          fi

      - name: Download sources
        run: |
          cd .work/openwrt
          make download -j"$(nproc)" V=s

      - name: Build firmware
        run: |
          set +e
          cd .work/openwrt
          export CCACHE_DIR="$GITHUB_WORKSPACE/.cache/ccache"
          if [ "$DEBUG_BUILD" = true ]; then
            verbosity=V=1
          else
            verbosity=V=s
          fi
          make -j"$(nproc)" "$verbosity" 2>&1 | tee "$GITHUB_WORKSPACE/.work/build-parallel.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo 'Parallel build failed; retrying with one job and verbose output.' >&2
            make -j1 V=1 2>&1 | tee "$GITHUB_WORKSPACE/.work/build-single.log"
            result=${PIPESTATUS[0]}
          fi
          exit "$result"

      - name: Capture RTL8189ES compile warnings
        if: success()
        run: |
          set +e
          cd .work/openwrt
          make package/kernel/rtl8189es/clean > "$GITHUB_WORKSPACE/.work/rtl8189es-compile.log" 2>&1
          clean_result=$?
          make package/kernel/rtl8189es/compile -j1 V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/.work/rtl8189es-compile.log"
          compile_result=${PIPESTATUS[0]}
          cd "$GITHUB_WORKSPACE"
          printf 'clean=%s\ncompile=%s\n' "$clean_result" "$compile_result" > .work/rtl8189es-compile.status
          sed -E 's/\x1B\[[0-9;]*[mK]//g' .work/rtl8189es-compile.log |
            grep -Ei '(^|/)(core|hal|include|os_dep|platform)/.*warning:|implicit declaration|^WARNING: modpost:.*rtl8189es' |
            sed -E 's#^.*rtl8189es-[^/]+/##; s/:[0-9]+:[0-9]+:/:LINE:/' |
            sort -u > .work/rtl8189es-compile-warnings.txt || true
          exit 0

      - name: Capture RTL8189ES compile evidence
        if: success()
        run: |
          set -eu
          evidence="$GITHUB_WORKSPACE/.work/rtl8189es-diag-evidence"
          mkdir -p "$evidence"
          source_dir="$GITHUB_WORKSPACE/.work/openwrt/build_dir/target-aarch64_cortex-a53_musl/linux-sunxi_cortexa53"
          source_root=$(find "$source_dir" -mindepth 1 -maxdepth 1 -type d -name 'rtl8189es-*' | sort | head -n 1 || true)
          if [ -z "$source_root" ]; then
            echo 'rtl8189es build directory not found' > "$evidence/status.txt"
          else
            printf 'source_root=%s\n' "$source_root" > "$evidence/status.txt"
            find "$source_root" -type f \( \
              -name 'os_intfs.o' -o -name 'sdio_ops_linux.o' -o -name 'sdio_ops.o' -o \
              -name '.os_intfs.o.cmd' -o -name '.sdio_ops_linux.o.cmd' -o -name '.sdio_ops.o.cmd' -o \
              -name 'rtl8189es.ko' \
            \) -print | sort > "$evidence/file-list.txt"

            for pair in \
              'os_dep/linux/os_intfs.c os_dep/linux/os_intfs.o .os_intfs.o.cmd os_intfs.i' \
              'os_dep/linux/sdio_ops_linux.c os_dep/linux/sdio_ops_linux.o .sdio_ops_linux.o.cmd sdio_ops_linux.i' \
              'hal/rtl8188e/sdio/sdio_ops.c hal/rtl8188e/sdio/sdio_ops.o .sdio_ops.o.cmd sdio_ops.i'; do
              set -- $pair
              src="$source_root/$1"
              obj="$source_root/$2"
              cmdfile="$source_root/$(dirname "$2")/$3"
              out="$evidence/$4"
              [ -f "$obj" ] && cp "$obj" "$evidence/$(basename "$obj")"
              [ -f "$cmdfile" ] && cp "$cmdfile" "$evidence/$(basename "$cmdfile")"
              if [ -f "$src" ] && [ -f "$cmdfile" ]; then
                cmd=$(sed -n 's/^cmd_.* := //p' "$cmdfile" | head -n 1)
                if [ -n "$cmd" ]; then
                  cmd=$(printf '%s\n' "$cmd" | sed 's/[[:space:]]-c[[:space:]]/ -E -dD /' | sed -E "s#[[:space:]]-o[[:space:]]+[^[:space:]]+\.o# -o '$out'#")
                  (cd "$(dirname "$src")" && eval "$cmd") || printf 'preprocess failed: %s\n' "$src" >> "$evidence/status.txt"
                else
                  printf 'no command in %s\n' "$cmdfile" >> "$evidence/status.txt"
                fi
              fi
            done

            find "$source_root" -type f -name 'rtl8189es.ko' -print | sort > "$evidence/ko-candidates.txt"
            while IFS= read -r ko; do
              [ -f "$ko" ] || continue
              name=$(printf '%s' "$ko" | sed "s#^$source_root/##; s#[/ ]#_#g")
              cp "$ko" "$evidence/ko-$name"
            done < "$evidence/ko-candidates.txt"
            sha256sum "$evidence"/* > "$evidence/sha256sums" 2>/dev/null || true
          fi

      - name: List target output files
        if: always()
        run: |
          mkdir -p .work
          {
            echo "===== TARGET OUTPUT FILES ====="
            if [ -d .work/openwrt/bin/targets ]; then
              find .work/openwrt/bin/targets \
                -maxdepth 6 \
                -type f \
                -printf '%p\t%s bytes\n' \
                2>/dev/null | sort
            else
              echo "bin/targets not found"
            fi
          } | tee .work/target-output-files.txt

      - name: Keep build inventory
        if: ${{ env.KEEP_BUILD_INFO == 'true' }}
        run: |
          mkdir -p .work/build-info
          du -sh .work/openwrt/* .work/openwrt/build_dir/* .work/openwrt/staging_dir/* 2>/dev/null > .work/build-info/size.txt || true
          find .work/openwrt/build_dir -maxdepth 4 -type f -name '*.log' -print > .work/build-info/log-files.txt || true

      - name: Collect and verify image
        if: success()
        run: |
          ./scripts/collect-artifacts.sh \
            .work/openwrt/bin/targets/sunxi/cortexa53 \
            .work/artifact \
            .work/openwrt
          if [ -f .work/build-single.log ]; then
            cat .work/build-parallel.log .work/build-single.log > .work/artifact/build.log
          else
            cp .work/build-parallel.log .work/artifact/build.log
          fi
          for file in rtl8189es-compile.log rtl8189es-compile.status rtl8189es-compile-warnings.txt; do
            [ -f ".work/$file" ] && cp ".work/$file" ".work/artifact/$file"
          done
          {
            printf 'STATUS=UNVERIFIED\n'
            printf 'COMMIT=%s\n' "$GITHUB_SHA"
            printf 'PROFILE=%s\n' "$BUILD_PROFILE"
            sha256sum .work/artifact/NanoPi-K1-Plus-sunxi-cortexa53.img.gz | awk '{print "IMAGE_SHA256=" $1}'
          } > .work/artifact/VERSION.txt
          ./scripts/verify-image.sh .work/artifact "$BUILD_PROFILE" .work/openwrt
          sha256sum .work/artifact/rtl8189es.image.ko | awk '{print "RTL8189ES_SHA256=" $1}' >> .work/artifact/VERSION.txt
          cp .work/source.log .work/artifact/source.log
          cp .work/patch.log .work/artifact/patch.log
          [ -f .work/target-output-files.txt ] && cp .work/target-output-files.txt .work/artifact/target-output-files.txt
          [ "$KEEP_BUILD_INFO" = true ] && cp -r .work/build-info .work/artifact/ || true

      - name: Prepare failure diagnostics
        if: failure()
        run: |
          mkdir -p .work/failure
          for log in .work/build-parallel.log .work/build-single.log .work/source.log .work/patch.log; do
            [ -f "$log" ] && tail -n 5000 "$log" >> .work/failure/last-5000-lines.log
          done
          [ -f .work/openwrt/.config ] && cp .work/openwrt/.config .work/failure/openwrt.config
          [ -f .work/patch.log ] && cp .work/patch.log .work/failure/patch.log
          [ -f .work/target-output-files.txt ] && cp .work/target-output-files.txt .work/failure/target-output-files.txt
          for file in \
            dtb-source.txt \
            kernel-config-source.txt \
            sun50i-h5-nanopi-k1-plus.dtb \
            sun50i-h5-nanopi-k1-plus.compiled.dts \
            kernel.config \
            openwrt.config \
            sha256sums \
            uEnv-a64.txt \
            sunxi-inittab \
            k1-plus-mmc-cross-mount-policy \
            k1-plus-wifi-compat-lan-policy \
            k1-plus-wifi-compat-v2-policy \
            k1-plus-wifi-compat-v3-policy \
            k1-plus-wireless-config \
            rtl8189es.ko \
            rtl8189es.build-check.txt \
            rtl8189es.image.ko \
            rtl8189es.image.sha256 \
            rtl8189es.image.relocations.txt \
            rtl8189es.image.symbols.txt \
            rtl8189es.modules.d \
            rtl8189es-compile.log \
            rtl8189es-compile.status \
            rtl8189es-compile-warnings.txt \
            rtl8189es-uci-defaults-50_rtl-wifi \
            stage-a-display-validation.txt \
            base-profile-manifest-validation.txt \
            full-profile-manifest-validation.txt \
            wifi-compat-profile-manifest-validation.txt \
            wifi-compat-v2-profile-manifest-validation.txt \
            wifi-compat-v3-profile-manifest-validation.txt \
            wifi-release-v1-profile-manifest-validation.txt \
            k1-plus-wifi-release-v1-policy \
            k1plus-network-mode \
            k1plus-wifi-watchdog \
            k1plus-network-config \
            k1plus-watchdog-config \
            wifi-release-v1-rootfs-validation.txt \
            wifi-release-v1-command-dependencies.md \
            wifi-release-v1-firstboot-dry-run.txt \
            wifi-release-v1-dryrun-env.txt \
            VERSION.txt \
            rtl8189es-inert-profile-manifest-validation.txt \
            buddha-profile-manifest-validation.txt; do
            [ -f ".work/artifact/$file" ] && cp ".work/artifact/$file" ".work/failure/$file"
          done
          [ ! -d .work/artifact/wifi-release-v1-dryrun-rootfs ] || \
            cp -r .work/artifact/wifi-release-v1-dryrun-rootfs .work/failure/
          df -h > .work/failure/disk-space.txt

      - name: Stage firmware artifact
        if: success()
        run: |
          set -eu
          source_dir=.work/artifact
          firmware_dir=.work/firmware-artifact
          rm -rf "$firmware_dir"
          mkdir -p "$firmware_dir"
          for pattern in \
            'NanoPi-K1-Plus-sunxi-cortexa53.img.gz' \
            '*.img.gz' \
            '*.dtb' \
            '*.manifest' \
            'VERSION.txt' \
            'sha256sums' \
            '*validation*.txt' \
            '*validation*.md' \
            '*policy' \
            '*config' \
            '*dependencies.md' \
            'target-output-files.txt'; do
            find "$source_dir" -maxdepth 1 -type f -name "$pattern" \
              -exec cp -p {} "$firmware_dir/" \;
          done
          test -s "$firmware_dir/NanoPi-K1-Plus-sunxi-cortexa53.img.gz"
          test -s "$firmware_dir/VERSION.txt"
          chmod -R a+rX "$firmware_dir"

      - name: Upload successful firmware
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NanoPi-K1-Plus-OpenWrt
          path: .work/firmware-artifact
          if-no-files-found: error
          include-hidden-files: true

      - name: Verify intentional dry-run failure is non-blocking
        if: always()
        continue-on-error: true
        run: |
          set +e
          ./scripts/dry-run-wifi-release-v1.sh \
            .work/artifact/does-not-exist \
            .work/intentional-dry-run-failure.txt \
            .work/intentional-dry-run-rootfs \
            .work/intentional-dry-run-env.txt
          status=$?
          set -e
          [ "$status" -ne 0 ]
          [ -s .work/artifact/NanoPi-K1-Plus-sunxi-cortexa53.img.gz ]
          echo 'Intentional dry-run failure was observed without blocking the firmware upload path.' >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize firstboot dry-run status
        if: always()
        continue-on-error: true
        run: |
          if grep -q '^DRY-RUN: FAILED' .work/artifact/VERSION.txt; then
            {
              echo '### WARNING: firstboot dry run failed';
              echo '';
              echo 'Mandatory release gates passed; image is uploaded as UNVERIFIED.';
              echo 'See the dry-run report, environment report, and sanitized rootfs diagnostics.';
            } >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '^DRY-RUN: SKIPPED' .work/artifact/VERSION.txt; then
            {
              echo '### WARNING: firstboot dry run skipped';
              echo '';
              echo 'Mandatory release gates passed; image is uploaded as UNVERIFIED.';
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Firstboot dry run passed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage diagnostics
        if: always()
        continue-on-error: true
        run: |
          set +e
          diagnostics=.work/diagnostics
          rm -rf "$diagnostics"
          mkdir -p "$diagnostics"

          copy_if_present() {
            source=$1
            target=$2
            [ -e "$source" ] || return 0
            sudo -n cp -a "$source" "$target"
          }

          for file in \
            wifi-release-v1-firstboot-dry-run.txt \
            wifi-release-v1-dryrun-env.txt \
            wifi-release-v1-command-dependencies.md \
            wifi-release-v1-rootfs-validation.txt; do
            copy_if_present ".work/artifact/$file" "$diagnostics/"
          done
          if [ -d .work/artifact/wifi-release-v1-dryrun-rootfs ]; then
            sudo -n cp -a .work/artifact/wifi-release-v1-dryrun-rootfs "$diagnostics/"
          fi
          if [ -d .work/rtl8189es-diag-evidence ]; then
            sudo -n cp -a .work/rtl8189es-diag-evidence "$diagnostics/"
          fi

          # Keep diagnostics readable without ever traversing virtual filesystems.
          if [ -d "$diagnostics" ]; then
            sudo -n find "$diagnostics" \
              \( -path "$diagnostics/dev" -o -path "$diagnostics/proc" -o -path "$diagnostics/sys" \) -prune -o \
              \( -iname '*password*' -o -iname '*passphrase*' -o -iname '*psk*' -o -iname '*secret*' \) -prune -o \
              -exec chown "$(id -u):$(id -g)" {} +
            sudo -n find "$diagnostics" \
              \( -path "$diagnostics/dev" -o -path "$diagnostics/proc" -o -path "$diagnostics/sys" \) -prune -o \
              \( -iname '*password*' -o -iname '*passphrase*' -o -iname '*psk*' -o -iname '*secret*' \) -prune -o \
              -exec chmod a+rX {} +
          fi

      - name: Upload diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NanoPi-K1-Plus-diagnostics
          path: .work/diagnostics
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload RTL8189ES compile evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rtl8189es-diag-evidence
          path: .work/rtl8189es-diag-evidence
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NanoPi-K1-Plus-failure
          path: .work/failure
          if-no-files-found: warn
