name: make-observe-variant

on:
  push:
    branches:
      - 'diag/strict-pair-*'
    paths:
      - '.github/variant-inputs.json'
      - '.github/workflows/make-observe-variant.yml'

permissions:
  contents: read
  actions: read

jobs:
  validation-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download base image for validation regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_run_id=$(jq -r .base_run_id .github/variant-inputs.json)
          gh run download "$base_run_id" --repo "$GITHUB_REPOSITORY" \
            --name NanoPi-K1-Plus-OpenWrt --dir work/base
          mapfile -t images < <(find work/base -type f -name '*ext4-sdcard.img.gz' -print | sort)
          if [ "${#images[@]}" -ne 1 ]; then
            printf 'need exactly one base image; found %s candidates:\n' "${#images[@]}" >&2
            printf '%s\n' "${images[@]}" >&2
            exit 1
          fi
          printf 'P2_BASE_IMAGE=%s\n' "${images[0]}"

      - name: Run independent validation false-positive regressions
        run: |
          image=$(find work/base -type f -name '*ext4-sdcard.img.gz' -print -quit)
          python3 scripts/test-validation-regressions.py \
            --image "$image" --old-revision b9e5348^

  variant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs squashfs-tools

      - name: Run variant selftest first
        env:
          VARIANT_DIAGNOSTICS_DIR: ${{ github.workspace }}/variant-diagnostics
        run: |
          set -o pipefail
          mkdir -p variant-diagnostics
          sudo --preserve-env=VARIANT_DIAGNOSTICS_DIR python3 scripts/selftest_variant.py \
            2>&1 | tee variant-diagnostics/selftest.log
          grep -q '^SQUASHFS_SELFTEST=PASS$' variant-diagnostics/selftest.log

      - name: Validate inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          with open('.github/variant-inputs.json', encoding='utf-8') as stream:
              data = json.load(stream)
          for key in ('base_run_id', 'compare_run_id'):
              if not re.fullmatch(r'[0-9]+', str(data[key])):
                  raise SystemExit(f'{key} must contain digits only')
          if not data['target_path'].startswith('/'):
              raise SystemExit('target_path must be absolute')
          if data['target_path'] != '/etc/wifi-watchdog.mode':
              raise SystemExit('unexpected target_path')
          for key in ('base_run_id', 'compare_run_id', 'image_glob', 'target_path', 'old_content', 'new_content'):
              value = str(data[key]).replace('\n', r'\n')
              print(f'{key}={value}')
          PY

      - name: Download existing build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN_ID: ${{ steps.inputs.outputs.base_run_id }}
          COMPARE_RUN_ID: ${{ steps.inputs.outputs.compare_run_id }}
          IMAGE_GLOB: ${{ steps.inputs.outputs.image_glob }}
        run: |
          set -euo pipefail
          for item in "base:$BASE_RUN_ID" "reference:$COMPARE_RUN_ID"; do
            name=${item%%:*}
            run_id=${item#*:}
            dest="work/$name"
            mkdir -p "$dest"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name NanoPi-K1-Plus-OpenWrt --dir "$dest/download"
            mapfile -t images < <(find "$dest/download" -type f -name "$IMAGE_GLOB" -print | sort)
            if [ "${#images[@]}" -ne 1 ]; then
              printf 'need exactly one image for run %s; found %s candidates:\n' "$run_id" "${#images[@]}" >&2
              printf '%s\n' "${images[@]}" >&2
              find "$dest/download" -type f -print | sort >&2
              exit 1
            fi
            cp -- "${images[0]}" "$dest/image.img.gz"
            sha256sum "$dest/image.img.gz" | tee "$dest/sha256.txt"
          done

      - name: Make Observe variant from Recover bytes
        env:
          VARIANT_DIAGNOSTICS_DIR: ${{ github.workspace }}/variant-diagnostics
          TARGET_PATH: ${{ steps.inputs.outputs.target_path }}
          OLD_CONTENT: ${{ steps.inputs.outputs.old_content }}
          NEW_CONTENT: ${{ steps.inputs.outputs.new_content }}
        run: |
          sudo --preserve-env=VARIANT_DIAGNOSTICS_DIR python3 scripts/make_variant.py make \
            --base work/base/image.img.gz --output work/observe.img.gz \
            --target "$TARGET_PATH" --old-content "$OLD_CONTENT" \
            --new-content "$NEW_CONTENT" --report make-report.md

      - name: Preserve selftest and make diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: variant-diagnostics/

      - name: Independently verify variant
        env:
          TARGET_PATH: ${{ steps.inputs.outputs.target_path }}
          OLD_CONTENT: ${{ steps.inputs.outputs.old_content }}
          NEW_CONTENT: ${{ steps.inputs.outputs.new_content }}
        run: |
          sudo python3 scripts/make_variant.py verify \
            --base work/base/image.img.gz --compare work/observe.img.gz \
            --target "$TARGET_PATH" --old-content "$OLD_CONTENT" \
            --new-content "$NEW_CONTENT" --report verify-report.md

      - name: Compare existing Observe build for information
        run: |
          sudo python3 scripts/make_variant.py diff \
            --base work/base/image.img.gz --compare work/reference/image.img.gz \
            --report ci-pair-diff.md

      - name: Write checksums
        run: sha256sum work/observe.img.gz work/base/image.img.gz work/reference/image.img.gz > SHA256SUMS

      - name: Upload reports and variant
        uses: actions/upload-artifact@v4
        with:
          name: observe-variant-${{ github.run_id }}
          if-no-files-found: error
          path: |
            work/observe.img.gz
            work/base/sha256.txt
            work/reference/sha256.txt
            make-report.md
            verify-report.md
            ci-pair-diff.md
            SHA256SUMS
